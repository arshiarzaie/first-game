name: CI

# Minimal CI for the Phase 1 greybox: analyze -> test -> debug APK -> artifact.
# Debug APK is unsigned by design; no secrets are used anywhere in this file.

on:
  push:
    branches:
      - arena/60ed3a51-first-game
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The commit step below needs write access to push the resolved
      # pubspec.lock back to this branch. All other steps are read-only.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # Commits the CI-resolved pubspec.lock back to this branch so the exact
      # dependency set is reproducible and version-controlled. No-op once the
      # lock is in the repo. [skip ci] prevents workflow loops.
      - name: Commit resolved pubspec.lock
        run: |
          git config user.name "ci-lockfile-bot"
          git config user.email "ci-lockfile-bot@users.noreply.github.com"
          git add pubspec.lock
          git diff --cached --quiet && echo "pubspec.lock already up to date" \
            || (git commit -m "chore: commit CI-resolved pubspec.lock (run $GITHUB_RUN_ID) [skip ci]" \
                && git push)
        shell: bash

      - name: Static analysis
        run: |
          mkdir -p .ci-out
          flutter analyze | tee .ci-out/analyze.txt

      - name: Unit and widget tests
        run: |
          mkdir -p .ci-out
          flutter test | tee .ci-out/test.txt

      - name: Build debug APK
        run: |
          mkdir -p .ci-out
          flutter build apk --debug 2>&1 | tee .ci-out/build.txt

      # TEMPORARY diagnostic (removed once CI is stable): the sandbox cannot
      # reach the log-storage host, so failing step output is committed back
      # to this branch. End of job + continue-on-error so it never changes a
      # green result, and [skip ci] prevents workflow loops.
      - name: Publish failure output for sandbox inspection
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "ci-feedback-bot"
          git config user.email "ci-feedback-bot@users.noreply.github.com"
          mkdir -p ci-feedback
          cp .ci-out/*.txt ci-feedback/ 2>/dev/null || true
          echo "run: $GITHUB_RUN_URL" > ci-feedback/RUN.txt
          git add ci-feedback/
          git commit -m "ci(feedback): step output for run $GITHUB_RUN_ID [skip ci]" || true
          git push || true

      # Uploaded only when every preceding step passed (job stops on failure).
      - name: Upload debug APK + resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: soul-dusk-run-debug-apk
          path: |
            build/app/outputs/**/*.apk
            pubspec.lock
          if-no-files-found: error
          retention-days: 14
