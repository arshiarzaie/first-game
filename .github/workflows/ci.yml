name: CI

# Minimal CI for the Phase 1 greybox: analyze -> test -> debug APK -> artifact.
# Debug APK is unsigned by design; no secrets are used anywhere in this file.

on:
  push:
    branches:
      - arena/60ed3a51-first-game
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # Uploaded only when every preceding step passed (job stops on failure).
      # pubspec.lock is included so the exact resolved dependency set can be
      # committed for reproducibility (it cannot be generated in the
      # authoring sandbox because pub.dev is unreachable there).
      - name: Upload debug APK + resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: soul-dusk-run-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock
          if-no-files-found: error
          retention-days: 14
