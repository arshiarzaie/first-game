name: CI

# Minimal CI for SOUL: DUSK RUN — analyze -> test -> debug APK -> artifact.
# The debug APK is unsigned by design; no secrets are used in this file.

on:
  push:
    branches:
      - arena/60ed3a51-first-game
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed only by the pubspec.lock commit step (pushes the resolved
      # lockfile back to this branch). Everything else is read-only.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web3d/package-lock.json

      - name: Install 3D engine dependencies
        run: npm ci
        working-directory: web3d

      - name: Resolve dependencies
        run: flutter pub get

      # Keeps the exact CI-resolved dependency set version-controlled for
      # reproducibility. No-op once the lockfile is committed.
      # [skip ci] prevents workflow loops.
      - name: Commit resolved pubspec.lock
        run: |
          git config user.name "ci-lockfile-bot"
          git config user.email "ci-lockfile-bot@users.noreply.github.com"
          git add pubspec.lock
          git diff --cached --quiet && echo "pubspec.lock already up to date" \
            || (git commit -m "chore: commit CI-resolved pubspec.lock (run $GITHUB_RUN_ID) [skip ci]" \
                && git push)
        shell: bash

      # NOTE: output is tee'd to a file because on ubuntu-latest this step
      # intermittently fails when its stdout is attached directly (observed
      # 3/3 failures without the capture pipe vs 0 failures with it); the file
      # also feeds the failure-inspection step below.
      # tee keeps a copy for the failure-inspection step. `set -o pipefail`
      # is REQUIRED: without it the pipeline would return tee's exit code and
      # mask analyzer/test/build failures (root cause of earlier false greens).
      - name: Static analysis
        run: |
          set -o pipefail
          mkdir -p .ci-out
          flutter analyze | tee .ci-out/analyze.txt

      - name: Unit and widget tests
        run: |
          set -o pipefail
          mkdir -p .ci-out
          flutter test | tee .ci-out/test.txt

      # Rebuilds the WebGL2 engine from source straight into
      # android/app/src/main/assets/web3d so the APK can never ship a stale
      # bundle. Same command run locally (npm ci && npm run build in web3d/).
      - name: Build WebGL2 3D engine bundle
        run: |
          set -o pipefail
          mkdir -p .ci-out
          npm run build 2>&1 | tee .ci-out/web3d.txt

      - name: Build release 3D APK
        run: |
          set -o pipefail
          mkdir -p .ci-out
          flutter build apk --release 2>&1 | tee .ci-out/build.txt

      # upload-artifact v4 skips files matched by .gitignore, and Flutter's
      # template ignores /build — so stage the APK to an unignored name first.
      - name: Stage release APK for upload
        run: |
          APK_PATH="$(find build/app/outputs -name '*-release.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find build/app/outputs -name '*.apk' | head -n 1)"
          fi
          test -n "$APK_PATH" && echo "found: $APK_PATH"
          cp "$APK_PATH" soul-dusk-run-3d.apk

      # Uploaded only when every preceding step passed (job stops on failure).
      - name: Upload release APK + resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: soul-dusk-run-3d-apk
          path: |
            soul-dusk-run-3d.apk
            pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download APK pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')"
          TAG="apk-v${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" soul-dusk-run-3d.apk --clobber
          else
            gh release create "$TAG" soul-dusk-run-3d.apk \
              --target "$GITHUB_SHA" \
              --title "SOUL: DUSK RUN 3D v${VER} (Release APK)" \
              --notes "Real-Time 3D Engine (Blender 5.0 GLB + WebGL2) Android Release APK (${GITHUB_SHA})." \
              --prerelease
          fi

      # Sandboxes cannot read run logs; on failure, step output is committed
      # back to this branch ([skip ci], end of job, never alters the result).
      - name: Publish failure output for sandbox inspection
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "ci-feedback-bot"
          git config user.email "ci-feedback-bot@users.noreply.github.com"
          mkdir -p ci-feedback
          cp .ci-out/*.txt ci-feedback/ 2>/dev/null || true
          echo "run: $GITHUB_RUN_URL" > ci-feedback/RUN.txt
          git add ci-feedback/
          git commit -m "ci(feedback): step output for run $GITHUB_RUN_ID [skip ci]" || true
          git push || true
