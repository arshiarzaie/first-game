name: CI

# SOUL: DUSK RUN 3D — build WebGL2 engine -> assemble release APK -> publish.
# The APK is signed with the debug key by design; no secrets are used here.
#
# There is deliberately NO Flutter toolchain in this pipeline. MainActivity is
# a plain `android.app.Activity` hosting a WebView; the Flutter engine never
# starts, so building with `flutter build apk` only added ~70 MB of unused
# libflutter.so + Dart AOT. This is a straight Android Gradle build.

on:
  push:
    branches:
      - arena/60ed3a51-first-game
  pull_request:
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build 3D engine and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------- web engine
      # Runs first: Vite writes straight into
      # android/app/src/main/assets/web3d, so the APK can never ship a stale
      # bundle.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web3d/package-lock.json

      - name: Install 3D engine dependencies
        run: npm ci
        working-directory: web3d

      - name: Build WebGL2 3D engine bundle
        working-directory: web3d
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-out"
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/.ci-out/web3d.txt"

      # -------------------------------------------------------------- android
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify toolchain
        run: |
          java -version 2>&1 | head -n 1
          ./gradlew --version | grep -E "^(Gradle|JVM)" || true
        working-directory: android

      - name: Assemble release APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-out"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/.ci-out/build.txt"

      - name: Stage release APK for upload
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH" || { echo "no APK produced"; exit 1; }
          echo "found: $APK_PATH"
          cp "$APK_PATH" soul-dusk-run-3d.apk
          ls -l soul-dusk-run-3d.apk | awk '{printf "APK size: %.1f MB\n", $5/1048576}'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: soul-dusk-run-3d-apk
          path: soul-dusk-run-3d.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download APK pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_NAME="$(grep -m1 'versionName' android/app/build.gradle.kts \
                      | sed -E 's/.*"(.*)".*/\1/')"
          VER_CODE="$(grep -m1 'versionCode' android/app/build.gradle.kts \
                      | grep -oE '[0-9]+')"
          TAG="apk-v${VER_NAME}-${VER_CODE}"
          echo "tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" soul-dusk-run-3d.apk --clobber
          else
            gh release create "$TAG" soul-dusk-run-3d.apk \
              --target "$GITHUB_SHA" \
              --title "SOUL: DUSK RUN 3D v${VER_NAME} (${VER_CODE}) — Release APK" \
              --notes "Real-time 3D engine (Blender 5.0 GLB + Three.js WebGL2) Android release APK (${GITHUB_SHA}). Built with plain Gradle — no Flutter runtime bundled." \
              --prerelease
          fi

      # Sandboxes cannot read run logs; on failure, step output is committed
      # back to this branch ([skip ci], end of job, never alters the result).
      - name: Publish failure output for sandbox inspection
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "ci-feedback-bot"
          git config user.email "ci-feedback-bot@users.noreply.github.com"
          mkdir -p ci-feedback
          cp .ci-out/*.txt ci-feedback/ 2>/dev/null || true
          echo "run: $GITHUB_RUN_URL" > ci-feedback/RUN.txt
          git add ci-feedback/
          git commit -m "ci(feedback): step output for run $GITHUB_RUN_ID [skip ci]" || true
          git push || true
