name: soul_dusk_run
description: >-
  SOUL: DUSK RUN — a 2.5D-inspired offline endless runner built with Flutter
  and Flame. Phase 1: playable greybox prototype.
publish_to: 'none'
version: 0.1.0+1

environment:
  # Floors match flame 1.38.2's own constraints (Dart >=3.11, Flutter >=3.41).
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  # Pinned per Phase 1 approval (audit-verified compatibility).
  flame: 1.38.2
  # Reserved for Phase 2 persistence (best score/settings). Declared now so
  # dependency resolution is reproducible; intentionally unused in Phase 1.
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # P2 visual prototype slice: Soul hero sprite (magenta-keyed — see
  # lib/game/presentation/chroma_key.dart) and the Dusk Hollow backdrop.
  # P3B adds the approved 8-frame run cycle (pre-keyed at production time,
  # RGBA — loaded directly, no load-time keying needed).
  assets:
    - assets/images/soul/soul_hero.png
    - assets/images/soul/run/frame_01.png
    - assets/images/soul/run/frame_02.png
    - assets/images/soul/run/frame_03.png
    - assets/images/soul/run/frame_04.png
    - assets/images/soul/run/frame_05.png
    - assets/images/soul/run/frame_06.png
    - assets/images/soul/run/frame_07.png
    - assets/images/soul/run/frame_08.png
    - assets/images/worlds/dusk_hollow/backdrop.png
    # S1 UI shell: cinematic title key art (approved concept board identity).
    - assets/images/ui/title_key_art.png
